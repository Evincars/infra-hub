services:
  mysql:
    image: mysql:8.4
    container_name: service-watcher-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: service_watcher
      MYSQL_USER: watcher
      MYSQL_PASSWORD: watcher
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
