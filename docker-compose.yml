services:
  postgres:
    image: postgres:18
    container_name: service-watcher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: service_watcher
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+ keeps data in a versioned subdirectory, so mount the parent directory
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher -d service_watcher"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
